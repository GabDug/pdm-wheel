[build-system]
build-backend = "pdm.backend"
requires = [
  "pdm-backend",
]

[project]
name = "pdm-wheel"
description = "PDM plugin that save your requirements as wheels, similar to pip-wheel"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "Gabriel Dugny", email = "pdm-wheel@dugny.me" } ]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dynamic = [
  "version",
]
dependencies = []
optional-dependencies.pdm = [
  "pdm!=2.13,!=2.13.1,>=2.7.4",
]
urls."Bug Tracker" = "https://github.com/GabDug/pdm-wheel/issues"
urls.Changelog = "https://github.com/GabDug/pdm-wheel/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/GabDug/pdm-wheel"
entry-points.pdm.pdm-wheel = "pdm_wheel:register_pdm_plugin"

[tool.pdm]
plugins = [ "-e .", "sync-pre-commit-lock" ]
version.source = "scm"
version.write_to = "pdm_wheel/_version.py"
version.write_template = "__version__: str = \"{}\"\n"
build.includes = [ "src", "src/pdm_wheel" ]
build.excludes = [
  ".pdm-python",
  ".venv",
  "tests/.*",
  "tests/build",
  "tests/fixtures/.*",
  "tests/fixtures/wheels",
]
build.package-dir = "src"
scripts.doc = { shell = "cd docs && mkdocs serve", help = "Start the dev server for doc preview" }
scripts.fmt = { cmd = "black .", help = "Run black formatter" }
scripts.lint = "pre-commit run --all-files"
scripts.lint-mypy = { cmd = "mypy src", help = "Run mypy type checker" }
scripts.lint-ruff = { cmd = "ruff check .", help = "Run ruff linter" }
scripts.test = "pytest"
scripts.test-cov = { cmd = "pytest --junitxml=junit/test-results.xml --cov --cov-report=xml --cov-report=html --cov-report=term-missing", help = "Run tests with coverage" }
dev-dependencies.dev = [
  "black>=22.10.0",
  "ipdb>=0.13.13",
  "mypy>=1.4",
  "parver>=0.4",
  "pdm>=2.4.0",
  "pylint>=2.15.4",
  "pytest-cov>=4.0.0",
  "pytest>=7.2.0",
  "ruff>=0.0.270",
  "tox-gh>=1.3.1",
  "tox-pdm>=0.7.2",
  "tox>=4.14.2",
]
dev-dependencies.testtox = [
  "click>=8.1.7",
  "pytest-cov>=4.0.0",
  "pytest>=7.2.0",
]

[tool.black]
line-length = 120
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tests/fixtures
)/
'''

[tool.ruff]
line-length = 120
exclude = [ ".git", "__pypackages__", "build", "dist", "env", "tests/fixtures/*" ]
lint.extend-select = [
  "D202",
  "D209",
  "E",
  "EM101",
  "F",
  "I",
  "I001",
  "PTH",
  "PYI",
  "Q000",
  "RET",
  "S",
  "T",
  "TCH",
  "TCH",
  "W",
]
lint.extend-ignore = [ "E501", "S101" ]

[tool.mypy]
files = [ "src" ]
strict = true

[tool.pytest]
ini_options.minversion = "7.0"
ini_options.testpaths = [ "tests" ]
ini_options.norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__ node_modules .venv __pypackages__"

[tool.coverage]
run.source = [ "src", "tests" ]
run.include = [ "src/*" ]
run.omit = [ "*/tests/*" ]
run.branch = true
run.parallel = true
paths.source = [ "src", "*/site-packages" ]
report.precision = 2
report.exclude_lines = [
  "# nocov",
  '@(abc\.)?abstractmethod]',
  'class .*\bProtocol\):',
  "def __repr__",
  "except ImportError:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]
report.show_missing = true

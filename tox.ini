[tox]
requires =
    tox>=4.2
env_list =
    report
    clean
    py{313, 312}-pdm{225, 224, 223, 222, 221, 220, HEAD}
    py{311, 310, 39}-pdm{225, 224, 223, 222, 221, 220, 219, 218, 217, 216, 215, 213, 212, 211, 210, 29, 28, 27}

[testenv]
set_env =
    py{39,310,311,312,313}-pdm{27,28,29,210,211,212,213,215,216,217,218,219,220,221,222,223,224,225}: COVERAGE_FILE = .coverage.{envname}
commands =
    pytest --cov --cov-append --cov-report=term-missing {posargs:-vv} --cov-config=pyproject.toml
depends =
    report: py{313, 312, 311, 310, 39}-pdm{225, 224, 223, 222, 221, 220, 219, 218, 217, 216, 215, 213, 212, 211, 210, 29, 28, 27}
    py{313, 312}-pdm{225, 224, 223, 222, 221, 220}: clean
    py{311, 310, 39}-pdm{225, 224, 223, 222, 221, 220, 219, 218, 217, 216, 215, 213, 212, 211, 210, 29, 28, 27}: clean

[testenv:report]
skip_install = true
commands =
    coverage combine
    coverage report
    coverage html
    coverage xml
groups =
    testtox

[testenv:clean]
skip_install = true
commands =
    coverage erase
groups =
    testtox

[testenv:py{39,310,311,312,313}-pdm{27,28,29,210,211,212,213,215,216,217,218,219,220,221,222,223,224,225}]
package = editable
deps =
    pdm210: pdm<2.11,>=2.10
    pdm211: pdm<2.12,>=2.11
    pdm212: pdm<2.13,>=2.12
    pdm213: pdm<2.14,>=2.13.2
    pdm214: pdm<2.15,>=2.14
    pdm215: pdm<2.16,>=2.15
    pdm216: pdm<2.17,>=2.16
    pdm217: pdm<2.18,>=2.17
    pdm218: pdm<2.19,>=2.18
    pdm219: pdm<2.20,>=2.19
    pdm220: pdm<2.21,>=2.20
    pdm221: pdm<2.22,>=2.21
    pdm222: pdm<2.23,>=2.22
    pdm223: pdm<2.24,>=2.23
    pdm224: pdm<2.25,>=2.24
    pdm225: pdm<2.26,>=2.25
    pdm27: pdm<2.8,>=2.7
    pdm28: pdm<2.9,>=2.8
    pdm29: pdm<2.10,>=2.9
    pdmHEAD: pdm@ git+https://github.com/pdm-project/pdm.git
groups =
    testtox

[gh]
python =
    3.9= py39-pdm{27,28,29,210,211,212,213,215,216,217,218,219,220,221,222,223,224,225}, report, clean
    3.10= py310-pdm{27,28,29,210,211,212,213,215,216,217,218,219,220,221,222,223,224,225}, report, clean
    3.11= py311-pdm{27,28,29,210,211,212,213,215,216,217,218,219,220,221,222,223,224,225}, report, clean
    3.12= py312-pdm{220,221,222,223,224,225}, report, clean
    3.13= py313-pdm{220,221,222,223,224,225}, report, clean
fail_on_no_env = True
